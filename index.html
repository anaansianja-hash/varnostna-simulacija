<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Varnostna simulacija</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f5fa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 35px;
      width: 340px;
      border-radius: 12px;
      box-shadow: 0 4px 20px #00000015;
    }
    h2 { text-align: center; }
    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #2858a5;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .notice {
      background: #fff3cd;
      padding: 12px;
      margin-bottom: 20px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="notice">
      IZOBRAŽEVALNA SIMULACIJA.<br>
      Ne vnašajte resničnih gesel ali osebnih podatkov.
    </div>

    <h2>Prijava v portal</h2>

    <input type="text" placeholder="Uporabniško ime"
           autocomplete="off">

    <input type="password" placeholder="Geslo"
           autocomplete="off">

    <button type="button"
      onclick="alert('To je varnostna simulacija. Podatki niso bili poslani ali shranjeni.')">
      Prijava
    </button>
  </div>
</body>
</html>
